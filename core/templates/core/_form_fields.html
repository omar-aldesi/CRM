{% for field in form %}
  <div class="field {% if field.name == 'description' or field.name == 'hook' or field.name == 'warning' or field.name == 'body' or field.name == 'note' %}full{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
      <div class="small muted">{{ field.help_text }}</div>
    {% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
{% if form.non_field_errors %}
  <div class="full">{{ form.non_field_errors }}</div>
{% endif %}
