{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - CRM</title>
  <script>
    (function () {
      try {
        var savedTheme = window.localStorage.getItem("crm-theme");
        document.documentElement.setAttribute("data-theme", savedTheme || "dark");
      } catch (error) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="{% static 'core/styles.css' %}">
</head>
<body class="login-shell">
  <main class="login-card">
    <h1 class="login-title">Sign in</h1>
    <p class="login-subtitle">Use your normal CRM username and password.</p>

    {% if form.non_field_errors %}
      <div class="message error">{{ form.non_field_errors }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
        {{ form.username.errors }}
      </div>
      <div class="field mt-12">
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
        {{ form.password.errors }}
      </div>
      <button class="btn btn-primary btn-block mt-18" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
