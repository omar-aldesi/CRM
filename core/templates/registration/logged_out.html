{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed out - CRM</title>
  <script>
    (function () {
      try {
        var savedTheme = window.localStorage.getItem("crm-theme");
        document.documentElement.setAttribute("data-theme", savedTheme || "dark");
      } catch (error) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="{% static 'core/styles.css' %}">
</head>
<body class="login-shell">
  <main class="login-card">
    <h1 class="login-title">Signed out</h1>
    <p class="login-subtitle">Your session has ended.</p>
    <a class="btn btn-primary btn-block" href="{% url 'login' %}">Sign in again</a>
  </main>
</body>
</html>
